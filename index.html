<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>اختبار تعفن الدماغ</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      animation: fadeIn 1s ease;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 35px;
    }

    .desc {
      text-align: center;
      margin-bottom: 30px;
      color: #ddd;
      line-height: 1.8;
    }

    .question {
      margin-bottom: 30px;
    }

    .question h3 {
      margin-bottom: 15px;
      color: #fff;
    }

    label {
      display: block;
      background: rgba(255,255,255,0.1);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    label:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.02);
    }

    input[type="radio"] {
      margin-left: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(to right, #0072ff, #00c6ff);
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    button:hover {
      transform: scale(1.03);
    }

    .result {
      margin-top: 30px;
      padding: 25px;
      border-radius: 20px;
      display: none;
      animation: fadeIn 1s ease;
      line-height: 2;
    }

    .result h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    .result ul {
      padding-right: 20px;
    }

    .healthy {
      background: rgba(0, 255, 100, 0.15);
      border: 2px solid #00ff88;
    }

    .warning {
      background: rgba(255, 200, 0, 0.15);
      border: 2px solid #ffd000;
    }

    .danger {
      background: rgba(255, 0, 0, 0.15);
      border: 2px solid #ff4d4d;
    }

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>اختبار تعفن الدماغ الرقمي</h1>

    <p class="desc">
      أجب على الأسئلة التالية بصدق لمعرفة مدى تأثير المحتوى الرقمي على تركيزك وانتباهك
    </p>

    <form id="quizForm">

      <div class="question">

        <h3>كم ساعة تشاهد فيديوهات قصيرة يومياً؟</h3>

        <label><input type="radio" name="q1" value="0"> أقل من ساعة</label>
        <label><input type="radio" name="q1" value="1"> 1 - 3 ساعات</label>
        <label><input type="radio" name="q1" value="2"> أكثر من 3 ساعات</label>

      </div>

      <div class="question">

        <h3>هل تجد صعوبة في التركيز أثناء القراءة؟</h3>

        <label><input type="radio" name="q2" value="0"> لا</label>
        <label><input type="radio" name="q2" value="1"> أحياناً</label>
        <label><input type="radio" name="q2" value="2"> نعم جداً</label>

      </div>

      <div class="question">

        <h3>هل تفتح هاتفك فور الاستيقاظ؟</h3>

        <label><input type="radio" name="q3" value="0"> لا</label>
        <label><input type="radio" name="q3" value="1"> بعد دقائق</label>
        <label><input type="radio" name="q3" value="2"> فوراً</label>

      </div>

      <div class="question">

        <h3>هل تشعر بالملل بدون الهاتف؟</h3>

        <label><input type="radio" name="q4" value="0"> لا</label>
        <label><input type="radio" name="q4" value="1"> قليلاً</label>
        <label><input type="radio" name="q4" value="2"> نعم جداً</label>

      </div>

      <button type="button" onclick="calculateResult()">
        احسب مستواي الآن
      </button>

    </form>

    <div id="result" class="result"></div>

  </div>

  <script>

    function calculateResult() {

      let total = 0;

      for (let i = 1; i <= 4; i++) {

        let answer = document.querySelector(`input[name="q${i}"]:checked`);

        if (!answer) {
          alert("يرجى الإجابة على جميع الأسئلة");
          return;
        }

        total += parseInt(answer.value);
      }

      let resultBox = document.getElementById("result");

      resultBox.style.display = "block";

      if (total <= 3) {

        resultBox.className = "result healthy";

        resultBox.innerHTML = `
        
          <h2>أنت سليم</h2>

          <p>
            لديك توازن جيد في استخدام المحتوى الرقمي وما زال تركيزك مستقراً بشكل ممتاز.
          </p>

          <h3>نصائح للحفاظ على مستواك:</h3>

          <ul>
            <li>استمر في تقليل وقت الفيديوهات القصيرة.</li>
            <li>خصص وقتاً يومياً للقراءة أو التعلم بدون هاتف.</li>
            <li>تجنب استخدام الهاتف قبل النوم.</li>
            <li>حافظ على ممارسة أنشطة تحتاج تركيزاً لفترة طويلة.</li>
          </ul>

        `;

      }

      else if (total <= 6) {

        resultBox.className = "result warning";

        resultBox.innerHTML = `
        
          <h2>مرحلة التشتت الرقمي</h2>

          <p>
            أنت قريب جداً من مرحلة تعفن الدماغ الرقمي وفقدان التركيز العميق.
          </p>

          <h3>تحذير:</h3>

          <p>
            الاستمرار في استهلاك المحتوى السريع بشكل مفرط قد يؤثر على الانتباه والذاكرة والإنتاجية.
          </p>

          <h3>طرق الوقاية:</h3>

          <ul>
            <li>حدد وقتاً معيناً لاستخدام التطبيقات الترفيهية.</li>
            <li>لا تبدأ يومك بتصفح الهاتف مباشرة.</li>
            <li>خفف مشاهدة الفيديوهات القصيرة المتتالية.</li>
            <li>خذ فترات راحة بدون شاشة أثناء اليوم.</li>
          </ul>

        `;

      }

      else {

        resultBox.className = "result danger";

        resultBox.innerHTML = `
        
          <h2>تعفن دماغ رقمي حاد</h2>

          <p>
            مستوى التشتت لديك مرتفع ويؤثر بشكل واضح على التركيز والانتباه.
          </p>

          <h3>طرق العلاج:</h3>

          <ul>
            <li>احذف تطبيقات الفيديوهات القصيرة لمدة أسبوع على الأقل.</li>
            <li>ابدأ بصيام رقمي يومي بدون أي شاشة.</li>
            <li>خصص وقتاً للقراءة الورقية يومياً.</li>
            <li>ابتعد عن الهاتف قبل النوم بساعة كاملة.</li>
            <li>مارس المشي أو الرياضة بدون محتوى أو سماعات.</li>
          </ul>

        `;

      }

    }

  </script>

</body>

</html>
